let L=null;
const PRAISE=['Isso aí!','Mandou bem!','Perfeito!','Boa!','Acertou!','Muito bem!'];
const RETRY=['Quase! Tente outra opção.','Ainda não. Leia com calma e tente de novo.','Sem pressa, você consegue.','Essa não. Olhe de novo e escolha outra.'];

function startLesson(i){
  const lesson=LESSONS[i];
  L={i:i,lesson:lesson,step:0,q:0,firstOK:0,tried:false,answered:false,
     qs:makeQs(lesson).map(toQ)};
  renderLesson(); show('s-lesson');
}
function segs(){
  const n=L.lesson.slides.length+L.qs.length, cur=L.step;
  let h=''; for(let k=0;k<n;k++) h+=`<i class="${k<cur?'on':(k===cur?'cur':'')}"></i>`; return h;
}
function renderLesson(){
  const root=$('#s-lesson'), lesson=L.lesson, ns=lesson.slides.length;
  if(L.step<ns){
    const sl=lesson.slides[L.step], last=L.step===ns-1, p=PLANETS[lesson.planet];
    root.innerHTML=`<div class="lhead"><button class="icon-btn" id="l-x" aria-label="Sair">✕</button><div class="segs">${segs()}</div><button class="icon-btn" id="l-say" aria-label="Ler em voz alta">🔊</button></div>
      <div class="card" id="l-card"><div class="ltag">${p.emoji} ${esc(lesson.title)} · página ${L.step+1} de ${ns}</div><h2>${sl.t}</h2><div class="lbody">${sl.h}</div></div>
      <div class="lfoot">${L.step>0?'<button class="btn ghost" id="l-prev">⬅</button>':''}<button class="btn ${last?'green':''}" id="l-next">${last?'Ir para o quiz! 🚀':'Próxima ➜'}</button></div>`;
    $('#l-next').onclick=()=>{ Snd.play('next'); L.step++; renderLesson(); window.scrollTo(0,0); };
    const pv=$('#l-prev'); if(pv) pv.onclick=()=>{ Snd.play('click'); L.step--; renderLesson(); window.scrollTo(0,0); };
    $('#l-say').onclick=()=>{ Snd.init(); speak($('#l-card').innerText.replace(/\n+/g,'. ')); };
  } else {
    const qi=L.step-ns, q=L.qs[qi]; L.q=qi; L.tried=false; L.answered=false;
    root.innerHTML=`<div class="lhead"><button class="icon-btn" id="l-x" aria-label="Sair">✕</button><div class="segs">${segs()}</div><button class="icon-btn" id="l-say" aria-label="Ler em voz alta">🔊</button></div>
      <div class="card" id="l-card"><div class="qtag">Pergunta ${qi+1} de ${L.qs.length}</div>${q.ctx?`<div class="qctx">${q.ctx}</div>`:''}<h2 class="q">${q.q}</h2>
      <div id="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${'ABCD'[k]}</span><span class="t">${o.t}</span></button>`).join('')}</div><div id="qfb"></div></div>
      <div class="lfoot" id="qfoot"></div>`;
    $$('.opt',root).forEach(b=>b.onclick=()=>answer(b,+b.dataset.k));
    $('#l-say').onclick=()=>{ Snd.init(); speak(q.q.replace(/<[^>]+>/g,'')+'. '+q.opts.map((o,k)=>'Opção '+'ABCD'[k]+': '+o.t.replace(/<[^>]+>/g,'')).join('. ')); };
  }
  $('#l-x').onclick=()=>{ Snd.play('click'); confirmBox('Sair da missão?','O que você fez nesta tentativa não conta. Quer mesmo sair?','Sair',()=>{ renderMap(false); show('s-map'); const n=$('#n-'+L.i); if(n) n.scrollIntoView({block:'center'}); },true); };
}
function answer(btn,k){
  if(L.answered) return;
  const q=L.qs[L.q], opt=q.opts[k];
  if(opt.ok){
    L.answered=true; if(!L.tried) L.firstOK++;
    $$('.opt').forEach(b=>b.disabled=true);
    btn.classList.add('ok'); Snd.play('correct'); fx.at(btn,26,{speed:7});
    $('#qfb').innerHTML=`<div class="fb ok"><span class="tico">🤖</span><div><b>${pick(PRAISE)}</b> ${q.why}</div></div>`;
    const lastQ=L.q===L.qs.length-1;
    $('#qfoot').innerHTML=`<button class="btn green" id="q-next">${lastQ?'Ver minhas estrelas ⭐':'Próxima pergunta ➜'}</button>`;
    $('#q-next').onclick=()=>{ Snd.play('next'); if(lastQ) finishLesson(); else { L.step++; renderLesson(); window.scrollTo(0,0); } };
    setTimeout(()=>{ const f=$('#qfoot'); if(f) f.scrollIntoView({block:'end',behavior:'smooth'}); },250);
  } else {
    L.tried=true; btn.classList.add('bad'); btn.disabled=true; Snd.play('wrong'); logWrong(q,L.lesson.title);
    $('#qfb').innerHTML=`<div class="fb no"><span class="tico">🤖</span><div>${pick(RETRY)}</div></div>`;
  }
}
function finishLesson(){
  const lesson=L.lesson, stars=(L.firstOK>=L.qs.length?3:(L.firstOK>=L.qs.length-1?2:1)), prev=starsOf(lesson.id), firstOK=L.firstOK, qn=L.qs.length;
  const before=totalStars();
  S.progress[lesson.id]={done:true,stars:Math.max(prev,stars)}; save();
  const after=totalStars();
  const newly=[0,1,2].filter(k=>before<need(k)&&after>=need(k));
  const planet=PLANETS[lesson.planet], pl=LESSONS.filter(l=>l.planet===lesson.planet);
  const planetDone = pl.every(l=>doneOf(l.id)) && !S.planetsSeen[planet.id];
  const nx=nextChestInfo(after);
  const root=$('#s-result');
  const msg = stars===3?'Missão perfeita! Três estrelas!':stars===2?'Muito bom! Falta pouco para as três estrelas.':'Missão cumprida! Tente de novo para ganhar mais estrelas.';
  const chestLine = newly.length ? `<div class="rchest up">🎉 Você destravou o ${TIERS[newly[0]].name}!</div>` : (nx?`<div class="rchest">Próximo: ${TIERS[nx.k].name} · faltam ${nx.left} ⭐ (você tem ${after})</div>`:`<div class="rchest up">Todos os baús destravados!</div>`);
  root.innerHTML=`<div class="res"><div class="rt">Missão cumprida!</div><div class="rs">${esc(lesson.title)}</div>
    <div class="rstars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="rm">${msg}</div><div class="rc">Você acertou ${firstOK} de ${qn} de primeira.</div>${chestLine}
    <button class="btn green block" id="r-go">${newly.length&&!planetDone?'Abrir o baú! 🎁':'Continuar a viagem ➜'}</button>
    ${stars<3?'<button class="btn ghost block" id="r-again">Jogar de novo para ganhar mais estrelas</button>':''}</div>`;
  show('s-result');
  const sp=$$('.rstars span',root);
  for(let k=0;k<stars;k++){ setTimeout(()=>{ sp[k].classList.add('on'); Snd.play('star'); fx.at(sp[k],18,{speed:6,shapes:['star']}); },500+k*600); }
  setTimeout(()=>{ Snd.play('complete'); if(stars===3){ fx.rain(2600); } else fx.burst(innerWidth/2,innerHeight*.35,40,{speed:9}); },500+stars*600);
  $('#r-go').onclick=()=>{
    Snd.play('next');
    if(planetDone){ S.planetsSeen[planet.id]=true; save(); showMedal(planet,()=>afterResult()); }
    else afterResult();
  };
  const ra=$('#r-again'); if(ra) ra.onclick=()=>{ Snd.play('next'); startLesson(L.i); };
  function afterResult(){
    if(newly.length){ chestQueue=newly.slice(); openChestScreen(chestQueue.shift(),{unlockAnim:true}); }
    else { renderMap(); show('s-map'); }
  }
}
/* =====================================================================
   SIMULADO: 20 questões, uma tentativa por pergunta, não vale estrelas
   ===================================================================== */
const plain=t=>String(t||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
function logWrong(q,lessonTitle){
  const right=(q.opts.find(o=>o.ok)||{}).t, key=lessonTitle+'|'+plain(q.q)+'|'+plain(q.ctx).slice(0,40);
  const e=S.hist[key]||(S.hist[key]={q:plain(q.q),c:plain(q.ctx).slice(0,80),l:lessonTitle,w:0,r:plain(right),d:0});
  e.w++; e.d=Date.now(); e.r=plain(right);
  const ks=Object.keys(S.hist);
  if(ks.length>300){ ks.sort((a,b)=>(S.hist[a].w-S.hist[b].w)||(S.hist[a].d-S.hist[b].d)); ks.slice(0,ks.length-300).forEach(k=>delete S.hist[k]); }
  save();
}
let SIM=null;
function simPick(){
  const pt=LESSONS.filter(l=>l.planet===0), ma=LESSONS.filter(l=>l.planet!==0);
  const chosen=pt.concat(shuffle(pt.slice()).slice(0,2)).concat(shuffle(ma.slice()).slice(0,12));
  chosen.sort((a,b)=>LESSONS.indexOf(a)-LESSONS.indexOf(b));
  const seen=new Set(), out=[];
  chosen.forEach(l=>{
    for(let t=0;t<12;t++){
      const e=pick(poolOf(l)), q=typeof e==='function'?e():e, key=q.q+'|'+(q.ctx||'');
      if(!seen.has(key)){ seen.add(key); out.push(Object.assign({},q,{lesson:l.title})); break; }
    }
  });
  return out;
}
function startSimulado(){
  const qs=simPick().map(q=>Object.assign(toQ(q),{lesson:q.lesson}));
  SIM={qs:qs,q:0,res:[],answered:false};
  renderSim(); show('s-lesson');
}
function renderSim(){
  const root=$('#s-lesson'), q=SIM.qs[SIM.q], n=SIM.qs.length; SIM.answered=false;
  let sg=''; for(let k=0;k<n;k++) sg+=`<i class="${k<SIM.q?'on':(k===SIM.q?'cur':'')}"></i>`;
  root.innerHTML=`<div class="lhead"><button class="icon-btn" id="l-x" aria-label="Sair">✕</button><div class="segs">${sg}</div><button class="icon-btn" id="l-say" aria-label="Ler em voz alta">🔊</button></div>
    <div class="card" id="l-card"><div class="qtag">📝 Simulado · pergunta ${SIM.q+1} de ${n}</div>${q.ctx?`<div class="qctx">${q.ctx}</div>`:''}<h2 class="q">${q.q}</h2>
    <div id="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${'ABCD'[k]}</span><span class="t">${o.t}</span></button>`).join('')}</div><div id="qfb"></div></div>
    <div class="lfoot" id="qfoot"></div>`;
  $$('.opt',root).forEach(b=>b.onclick=()=>answerSim(b,+b.dataset.k));
  $('#l-say').onclick=()=>{ Snd.init(); speak(q.q.replace(/<[^>]+>/g,'')+'. '+q.opts.map((o,k)=>'Opção '+'ABCD'[k]+': '+o.t.replace(/<[^>]+>/g,'')).join('. ')); };
  $('#l-x').onclick=()=>{ Snd.play('click'); confirmBox('Sair do simulado?','O simulado não será salvo. Quer mesmo sair?','Sair',()=>{ renderMap(false); show('s-map'); },true); };
}
function answerSim(btn,k){
  if(SIM.answered) return; SIM.answered=true;
  const q=SIM.qs[SIM.q], ok=q.opts[k].ok, right=q.opts.find(o=>o.ok).t, last=SIM.q===SIM.qs.length-1;
  $$('.opt').forEach((b,i)=>{ b.disabled=true; if(q.opts[i].ok) b.classList.add('ok'); });
  if(ok){ Snd.play('correct'); fx.at(btn,22,{speed:6}); } else { btn.classList.add('bad'); Snd.play('wrong'); logWrong(q,q.lesson); }
  SIM.res.push({q:q.q,ctx:q.ctx,right:right,chosen:q.opts[k].t,ok:ok,why:q.why,lesson:q.lesson});
  $('#qfb').innerHTML=ok?`<div class="fb ok"><span class="tico">🤖</span><div><b>${pick(PRAISE)}</b> ${q.why}</div></div>`
    :`<div class="fb no"><span class="tico">🤖</span><div><b>Não foi dessa vez.</b> A resposta certa é: ${right}. ${q.why}</div></div>`;
  $('#qfoot').innerHTML=`<button class="btn green" id="q-next">${last?'Ver meu resultado ⭐':'Próxima pergunta ➜'}</button>`;
  $('#q-next').onclick=()=>{ Snd.play('next'); if(last) finishSim(); else { SIM.q++; renderSim(); window.scrollTo(0,0); } };
  setTimeout(()=>{ const f=$('#qfoot'); if(f) f.scrollIntoView({block:'end',behavior:'smooth'}); },250);
}
function finishSim(){
  const n=SIM.qs.length, sc=SIM.res.filter(r=>r.ok).length, wrong=SIM.res.filter(r=>!r.ok);
  S.sim={best:Math.max((S.sim&&S.sim.best)||0,sc),last:sc,tries:((S.sim&&S.sim.tries)||0)+1,n:n}; save();
  const msg=sc>=n*0.9?'Incrível! Você está pronto para a prova!':sc>=n*0.7?'Muito bom! Veja os erros abaixo e vai ficar ainda melhor.':sc>=n*0.5?'Bom começo! Leia os erros abaixo e faça outro simulado.':'Vamos treinar mais! Releia as missões e tente de novo.';
  const root=$('#s-result');
  root.innerHTML=`<div class="res"><div class="rt">Simulado concluído!</div><div class="rs">Treino para a prova</div>
    <div class="simscore"><b>${sc}</b><span>de ${n}</span></div>
    <div class="rm">${msg}</div><div class="rc">Seu melhor resultado: ${S.sim.best} de ${n}. O simulado não conta estrelas.</div>
    <button class="btn green block" id="r-go">Voltar ao mapa ➜</button>
    <button class="btn ghost block" id="r-again">Fazer outro simulado</button>
    ${wrong.length?`<h3 class="simh">Para revisar (${wrong.length})</h3>`+wrong.map(r=>`<div class="card mist"><div class="sml">${esc(r.lesson)}</div>${r.ctx?`<div class="qctx">${r.ctx}</div>`:''}<div class="smq">${r.q}</div>
      <div class="smx">Você marcou: ${r.chosen}</div><div class="smo">Certa: ${r.right}</div><div class="smw">${r.why}</div></div>`).join(''):'<div class="rchest up">Você acertou tudo! 🎉</div>'}</div>`;
  show('s-result');
  Snd.play('complete'); if(sc>=n*0.9){ Snd.play('final'); fx.rain(2800); } else fx.burst(innerWidth/2,innerHeight*.3,40,{speed:9});
  $('#r-go').onclick=()=>{ Snd.play('next'); renderMap(false); show('s-map'); };
  $('#r-again').onclick=()=>{ Snd.play('next'); startSimulado(); };
}

function showMedal(planet,cb){
  const m=openModal(`<div class="big">${planet.medal}</div><h3>${planet.name} conquistado!</h3><p>Você completou todas as missões deste planeta. Continue a viagem rumo ao tesouro!</p><button class="btn block" id="md-ok">Seguir viagem 🚀</button>`,'medal');
  Snd.play('planet'); fx.rain(3500); fx.burst(innerWidth/2,innerHeight*.4,50,{speed:10});
  $('#md-ok',m).onclick=()=>{ Snd.play('next'); closeModal(); cb(); };
}

/* =====================================================================
   TELA: BAÚ / PRÊMIO
   ===================================================================== */
let chestBusy=false, chestQueue=[];
function prizeCard(k){
  const p=S.prizes[k];
  const pic = p.img ? `<img src="${p.img}" alt="Prêmio">` : `<div class="pe">${iconHTML(p.emoji)}</div>`;
  return `<div class="prize"><div class="card">${pic}<div class="ltag">Você ganhou:</div><h3>${esc(p.title)}</h3>${p.message?`<div class="pm">${esc(p.message)}</div>`:''}</div></div>`;
}
function openChestScreen(k,opts){
  opts=opts||{};
  const root=$('#s-chest'), preview=!!opts.preview, t=TIERS[k], ts=totalStars(), nd=need(k);
  const st=preview?'ready':chestState(k), p=S.prizes[k], hasPrize=!!(p.title||p.img);
  const already=st==='opened', anim=!!opts.unlockAnim && st==='ready';
  const lockedLook=st==='locked'||anim;
  let title,msg;
  if(st==='locked'){ title=t.name+' trancado'; msg=`Você tem ${ts} de ${nd} estrelas. Faltam ${nd-ts} ⭐ para destravar (média de ${k+1} por missão). Repita missões para ganhar mais estrelas.`; }
  else if(anim){ title=t.name; msg='Você chegou à média de '+(k+1)+(k===0?' estrela':' estrelas')+' por missão...'; }
  else if(already){ title='Seu prêmio'; msg='Toque no baú para ver a festa de novo.'; }
  else { title='Baú destravado!'; msg='Toque no baú para abrir.'; }
  chestBusy=anim;
  root.innerHTML=`<div class="chestwrap ${lockedLook?'locked':''}" id="cw">
    <div style="text-align:left;position:relative;z-index:2"><button class="icon-btn" id="c-back" aria-label="Voltar">⬅</button></div>
    <div class="rays" id="rays"></div>
    <h2 id="c-title">${title}</h2>
    <p class="cm" id="c-msg">${msg}</p>
    <div id="c-chest" style="position:relative">${chestSVG(already?'open':(st==='ready'&&!anim?'ready':''),k)}</div>
    <div id="c-prize"></div>
    ${preview?'<p class="cm" style="margin-top:14px"><b>Modo de teste:</b> assim o prêmio aparece para a criança.</p>':''}
  </div>`;
  show('s-chest');
  const svg=$('.chest',root), cw=$('#cw');
  if(already){ $('#rays').classList.add('on'); $('#c-prize').innerHTML=prizeCard(k); }
  $('#c-back').onclick=()=>{
    Snd.play('click'); chestBusy=false;
    if(preview){ renderMap(false); show('s-map'); openAdmin(); return; }
    if(chestQueue.length){ openChestScreen(chestQueue.shift(),{unlockAnim:true}); return; }
    renderMap(false); show('s-map');
  };
  if(anim){
    (async()=>{
      await wait(1100);
      Snd.play('unlock'); fx.at(svg,60,{speed:10,up:3});
      cw.classList.remove('locked'); svg.classList.add('ready');
      $('#c-title').textContent='Baú destravado!'; $('#c-msg').textContent='Toque no baú para abrir.';
      chestBusy=false;
    })();
  }
  svg.onclick=async()=>{
    Snd.init();
    if(chestBusy) return;
    if(st==='locked'){ Snd.play('lock'); svg.style.animation='shake .4s'; setTimeout(()=>svg.style.animation='',450); return; }
    if(!hasPrize){ $('#c-msg').textContent='O prêmio deste baú ainda não foi cadastrado. Peça ao seu pai ou à sua mãe.'; Snd.play('wrong'); return; }
    chestBusy=true;
    svg.classList.remove('ready','open'); $('#c-prize').innerHTML=''; $('#rays').classList.remove('on');
    $('#c-title').textContent='Abrindo...'; $('#c-msg').textContent='';
    Snd.play('drum'); svg.classList.add('shake'); await wait(1450);
    svg.classList.remove('shake'); svg.classList.add('open');
    Snd.play('final'); $('#rays').classList.add('on');
    fx.rain(6000); fx.at(svg,70,{speed:12,up:4});
    await wait(900);
    $('#c-title').textContent='Parabéns, '+(S.name||'astronauta')+'!';
    $('#c-msg').textContent='Você abriu o '+t.name+'!';
    $('#c-prize').innerHTML=prizeCard(k);
    $('#c-prize').scrollIntoView({block:'center',behavior:'smooth'});
    if(!preview){ S.opened[k]=true; save(); }
    chestBusy=false;
  };
}

function askPin(returnToAdmin){
  let v='';
  const m=openModal(`<div class="pinbox"><h3>Área do responsável</h3><p>Digite o PIN de 4 números.</p><div class="pins" id="pp"><i></i><i></i><i></i><i></i></div>
    <div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="x" style="font-size:20px">Fechar</button><button data-k="0">0</button><button data-k="b">⌫</button></div></div>`);
  const dots=$$('#pp i',m);
  function paint(){ dots.forEach((d,i)=>d.classList.toggle('on',i<v.length)); }
  $$('.keys button',m).forEach(b=>b.onclick=()=>{
    const k=b.dataset.k; Snd.init();
    if(k==='x'){ closeModal(); return; }
    Snd.play('click');
    if(k==='b') v=v.slice(0,-1); else if(v.length<4) v+=k;
    paint();
    if(v.length===4){
      if(v===S.pin){ openAdmin(); }
      else { Snd.play('wrong'); const pp=$('#pp',m); pp.classList.add('err'); setTimeout(()=>{ pp.classList.remove('err'); v=''; paint(); },450); }
    }
  });
}
function readImage(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image(); img.onload=()=>{
    const max=700, s=Math.min(1,max/Math.max(img.width,img.height)), w=Math.round(img.width*s), h=Math.round(img.height*s);
    const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
    cb(c.toDataURL('image/jpeg',.82)); }; img.src=fr.result; };
  fr.readAsDataURL(file);
}
function histHTML(){
  const L=Object.keys(S.hist).map(k=>S.hist[k]).sort((a,b)=>(b.w-a.w)||(b.d-a.d));
  if(!L.length) return '<p class="hint">Ainda não há erros anotados. A partir desta versão, cada resposta errada fica registrada aqui.</p>';
  const tot=L.reduce((a,e)=>a+e.w,0), by={};
  L.forEach(e=>by[e.l]=(by[e.l]||0)+e.w);
  const top=Object.keys(by).sort((a,b)=>by[b]-by[a]).slice(0,5).map(t=>esc(t)+' ('+by[t]+')').join(', ');
  return `<p class="hint">${tot} erro(s) em ${L.length} questão(ões). Mais erros em: ${top}.</p>${L.slice(0,40).map(e=>`<div style="text-align:left;padding:8px 0;border-top:1px solid #e3e6ff;font-size:15px;line-height:1.35;color:#1c2150"><b>${e.w}× errada</b> · <span style="color:#5a6090">${esc(e.l)}</span><br>${esc(e.q)}${e.c?' <i>('+esc(e.c)+'…)</i>':''}<br><b style="color:#0d5a2e">Certa: ${esc(e.r)}</b></div>`).join('')}${L.length>40?'<p class="hint">Mostrando as 40 com mais erros.</p>':''}<div class="btns"><button class="btn sm red" id="a-hclear">Limpar histórico</button></div>`;
}
const ICONS={'svg:trike':`<svg viewBox="0 0 64 64" width="1em" height="1em" aria-label="Triciclo"><g fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="46" r="9" fill="#3ee6ff" stroke="#1c2150" stroke-width="4"/><circle cx="14" cy="46" r="3" fill="#1c2150"/><circle cx="48" cy="52" r="5" fill="#ff5ea8" stroke="#1c2150" stroke-width="3"/><circle cx="58" cy="52" r="4" fill="#ff5ea8" stroke="#1c2150" stroke-width="3"/><path d="M14 46 L20 18 M12 16 L28 14" stroke="#1c2150" stroke-width="4"/><path d="M20 18 L30 34 L50 34 M30 34 L24 46 L46 50" stroke="#1c2150" stroke-width="4"/><path d="M38 34 L40 22 L54 22 L52 36 Z" fill="#ffd23f" stroke="#1c2150" stroke-width="3"/></g></svg>`,'svg:hama':`<svg viewBox="0 0 64 64" width="1em" height="1em" aria-label="Hama beads"><rect x="6" y="6" width="52" height="52" rx="8" fill="#eef0ff" stroke="#1c2150" stroke-width="3"/><g stroke="#1c2150" stroke-width="1.5"><circle cx="18" cy="18" r="5" fill="#ff5ea8"/><circle cx="32" cy="18" r="5" fill="#ffd23f"/><circle cx="46" cy="18" r="5" fill="#ff5ea8"/><circle cx="18" cy="32" r="5" fill="#3ee6ff"/><circle cx="32" cy="32" r="5" fill="#ff5ea8"/><circle cx="46" cy="32" r="5" fill="#3ee6ff"/><circle cx="18" cy="46" r="5" fill="#ff5ea8"/><circle cx="32" cy="46" r="5" fill="#3ddc84"/><circle cx="46" cy="46" r="5" fill="#ffd23f"/></g><g fill="#fff"><circle cx="18" cy="18" r="1.6"/><circle cx="32" cy="18" r="1.6"/><circle cx="46" cy="18" r="1.6"/><circle cx="18" cy="32" r="1.6"/><circle cx="32" cy="32" r="1.6"/><circle cx="46" cy="32" r="1.6"/><circle cx="18" cy="46" r="1.6"/><circle cx="32" cy="46" r="1.6"/><circle cx="46" cy="46" r="1.6"/></g></svg>`};
const iconHTML=e=>ICONS[e]||esc(e||'🎁');
const EMOJIS=['svg:trike','svg:hama','🎁','🍦','🍕','🎮','⚽','🚲','🎬','🏊','🧸','📚','🎢','🍫','🦖','🚀','🏆','🎨','🛹','🐶','🎂','🏖️'];
function openAdmin(){
  const drafts=S.prizes.map(p=>Object.assign({},p));
  let cur=0;
  const rows=LESSONS.map(l=>`<tr><td>${esc(l.title)}</td><td>${doneOf(l.id)?'⭐'.repeat(starsOf(l.id)):'—'}</td></tr>`).join('');
  const stl=k=>{ const x=chestState(k); return TIERS[k].medal+' '+TIERS[k].short+': '+(x==='locked'?'trancado':(x==='ready'?'destravado, ainda não aberto':'aberto')); };
  const m=openModal(`<div class="admin"><h3>Área do responsável</h3>
    ${S.pin==='1234'?'<div class="warn">O PIN ainda é o padrão (1234). Troque por outro na seção Segurança, no fim desta página.</div>':''}
    <div class="sec"><h4>🎁 Prêmios dos 3 baús</h4>
      <p class="hint">A criança só vê o que há dentro de cada baú quando ele é destravado.<br>🥉 Bronze: média de 1 estrela por missão (${need(0)} ⭐)<br>🥈 Prata: média de 2 estrelas (${need(1)} ⭐)<br>🥇 Ouro: 3 estrelas em todas as missões (${need(2)} ⭐)</p>
      <div class="tabs" id="a-tabs">${TIERS.map((t,k)=>`<button type="button" data-t="${k}" class="${k===0?'sel':''}">${t.medal} ${t.short}</button>`).join('')}</div>
      <div id="a-prize"></div>
      <div class="btns"><button class="btn green sm" id="a-save">Salvar prêmios</button><button class="btn sm ghost" id="a-test" style="color:#2a2f8f;background:#eef0ff;box-shadow:none">Ver este baú como a criança verá</button></div>
    </div>
    <div class="sec"><h4>👦 Criança</h4><label for="a-name">Nome</label><input type="text" id="a-name" maxlength="20" value="${esc(S.name)}"><div class="btns"><button class="btn sm" id="a-sname">Salvar nome</button></div></div>
    <div class="sec"><h4>📈 Progresso</h4><p class="hint">${doneCount()} de ${TOTAL} missões · ${totalStars()} de ${MAXSTARS} estrelas<br>${S.sim&&S.sim.tries?`Simulado: melhor ${S.sim.best}/${S.sim.n||20} · último ${S.sim.last}/${S.sim.n||20} · ${S.sim.tries} tentativa(s)<br>`:''}${[0,1,2].map(stl).join('<br>')}</p><table>${rows}</table>
      <div class="btns"><button class="btn sm red" id="a-reset">Zerar progresso</button></div></div>
    <div class="sec"><h4>🧾 Questões erradas</h4>${histHTML()}</div>
    <div class="sec"><h4>🔊 Voz da leitura</h4><p class="hint">É a voz do próprio aparelho. Se uma voz soar robótica, teste as outras da lista. As que têm Google, Natural ou Neural costumam ser melhores.</p>
      <label for="a-voice">Voz</label><select id="a-voice" style="width:100%;font:inherit;font-size:18px;padding:10px;border-radius:14px;border:3px solid #d9ddff;color:#1c2150;background:#fff"><option value="">Automática (a melhor encontrada)</option>${VOICES.map(v=>`<option value="${esc(v.name)}" ${v.name===S.voice?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select>
      ${VOICES.length?'':'<p class="hint">Este aparelho não informou vozes em português. Instale uma voz em Configurações → Idioma → Saída de texto para voz.</p>'}
      <div class="btns"><button class="btn sm" id="a-vtest">Testar voz</button></div></div>
    <div class="sec"><h4>💾 Backup</h4><p class="hint">Os dados ficam salvos neste aparelho e navegador. Para levar os prêmios e o progresso para outro aparelho, baixe o backup e restaure lá.</p>
      <div class="btns"><button class="btn sm" id="a-exp">Baixar backup</button><label class="btn sm ghost" style="color:#2a2f8f;background:#eef0ff;box-shadow:none;margin:0;display:inline-block;cursor:pointer">Restaurar backup<input type="file" id="a-imp" accept="application/json" style="display:none"></label></div></div>
    <div class="sec"><h4>🔒 Segurança</h4><label for="a-pin">Novo PIN (4 números)</label><input type="password" id="a-pin" inputmode="numeric" maxlength="4" placeholder="••••"><div class="btns"><button class="btn sm" id="a-spin">Trocar PIN</button></div></div>
    <div class="row"><button class="btn" id="a-close">Fechar</button></div></div>`);
  const flash=(el,t)=>{ const o=el.textContent; el.textContent=t; setTimeout(()=>{ el.textContent=o; },1600); };
  function commit(){ const t=$('#a-title',m); if(!t) return; const d=drafts[cur]; d.title=t.value.trim(); d.message=$('#a-msg',m).value.trim(); }
  function renderPrize(){
    const d=drafts[cur], t=TIERS[cur];
    $('#a-prize',m).innerHTML=`<label for="a-title">O que está dentro do ${t.name}?</label><input type="text" id="a-title" maxlength="80" placeholder="Ex.: Um passeio no parque de diversões" value="${esc(d.title)}">
      <label for="a-msg">Mensagem para ele (opcional)</label><textarea id="a-msg" maxlength="400" placeholder="Ex.: Parabéns pelo esforço! Combinamos o dia juntos.">${esc(d.message)}</textarea>
      <label>Ícone do prêmio</label><div class="emojis" id="a-emo">${EMOJIS.map(e=>`<button type="button" data-e="${e}" class="${e===d.emoji?'sel':''}">${iconHTML(e)}</button>`).join('')}</div>
      <label for="a-img">Foto do prêmio (opcional, aparece no lugar do ícone)</label><input type="file" id="a-img" accept="image/*">
      <div id="a-prev">${d.img?`<img class="prev" src="${d.img}" alt="">`:''}</div>
      ${d.img?'<button type="button" class="btn sm ghost" id="a-rmimg" style="color:#2a2f8f;background:#eef0ff;box-shadow:none;margin-top:6px">Remover foto</button>':''}`;
    $$('#a-emo button',m).forEach(b=>b.onclick=()=>{ commit(); d.emoji=b.dataset.e; Snd.play('click'); renderPrize(); });
    $('#a-img',m).onchange=e=>{ const f=e.target.files[0]; if(!f) return; commit(); readImage(f,x=>{ d.img=x; renderPrize(); }); };
    const rm=$('#a-rmimg',m); if(rm) rm.onclick=()=>{ commit(); d.img=''; renderPrize(); };
  }
  renderPrize();
  $$('#a-tabs button',m).forEach(b=>b.onclick=()=>{ commit(); cur=+b.dataset.t; $$('#a-tabs button',m).forEach(x=>x.classList.toggle('sel',x===b)); renderPrize(); });
  function savePrizes(){ commit(); S.prizes=drafts.map(d=>Object.assign({},d)); save(); }
  $('#a-save',m).onclick=function(){ savePrizes(); Snd.play('correct'); flash(this,'Salvo! ✓'); };
  $('#a-test',m).onclick=()=>{ savePrizes(); const p=S.prizes[cur]; if(!p.title&&!p.img){ alert('Escreva o que está dentro deste baú para testar.'); return; } closeModal(); openChestScreen(cur,{preview:true}); };
  $('#a-sname',m).onclick=function(){ S.name=$('#a-name',m).value.trim()||'Astronauta'; save(); flash(this,'Salvo! ✓'); };
  const hc=$('#a-hclear',m); if(hc) hc.onclick=()=>confirmBox('Limpar o histórico de erros?','As questões erradas anotadas serão apagadas. Estrelas e missões não mudam.','Limpar',()=>{ S.hist={}; save(); closeModal(); openAdmin(); },true);
  $('#a-reset',m).onclick=()=>confirmBox('Zerar o progresso?','Todas as estrelas, missões e baús abertos serão apagados. Os prêmios cadastrados continuam guardados.','Zerar',()=>{ S.progress={}; S.planetsSeen={}; S.opened={}; S.sim={best:null,last:null,tries:0,n:20}; save(); closeModal(); renderMap(); show('s-map'); },true);
  $('#a-exp',m).onclick=()=>{ const b=new Blob([JSON.stringify(S)],{type:'application/json'}), a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='missao-estelar-backup.json'; document.body.appendChild(a); a.click(); a.remove(); };
  $('#a-imp',m).onchange=e=>{ const f=e.target.files[0]; if(!f) return; const fr=new FileReader(); fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d||typeof d!=='object'||!d.progress) throw 0; S=migrate(Object.assign(JSON.parse(JSON.stringify(DEFAULT)),d)); save(); closeModal(); renderMap(); show('s-map'); }catch(err){ alert('Esse arquivo não parece ser um backup do aplicativo.'); } }; fr.readAsText(f); };
  $('#a-voice',m).onchange=e=>{ S.voice=e.target.value; save(); };
  $('#a-vtest',m).onclick=()=>{ Snd.init(); speak('Olá, '+(S.name||'astronauta')+'! Vamos estudar juntos? Dez dezenas formam uma centena. Um lápis custa R$ 2,50.'); };
  $('#a-spin',m).onclick=function(){ const v=$('#a-pin',m).value; if(!/^\d{4}$/.test(v)){ alert('O PIN precisa ter exatamente 4 números.'); return; } S.pin=v; save(); flash(this,'PIN trocado ✓'); $('#a-pin',m).value=''; };
  $('#a-close',m).onclick=()=>{ closeModal(); if($('#s-map').classList.contains('active')) renderMap(false); };
}

/* =====================================================================
   INÍCIO
   ===================================================================== */
if(S.name){ renderMap(); show('s-map'); } else { renderWelcome(); }

/* PWA: registra o service worker (só funciona em http/https) */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{}); });
}
})();
</script>
</body>
</html>
